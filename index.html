<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - David Johnston Interview</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; width: 90%; font-size: 16px; display: inline-block; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #888; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; font-size: 15px; line-height: 1.4; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        .timer-container { width: 100%; background: #222; height: 8px; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        #timer-bar { background: #00f2ff; height: 100%; width: 100%; transition: width 1s linear; }
        #progress { color: #00f2ff; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
        .lang-bar { padding: 15px; background: #111; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; border-top: 1px solid #222; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Banner" class="banner">
    
    <div id="start-screen">
        <h1 id="txt-title">David Johnston Quiz</h1>
        <p id="txt-desc">Expert interview quiz</p>
        <button class="btn" id="wallet-btn" onclick="connectWallet()">Connect GenLayer Studio</button>
        <button class="btn" id="start-quiz-btn" disabled onclick="startQuiz()" style="margin-top:20px; background:#ff0055; color:#fff;">START</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress">Question 1 / 10</div>
        <div class="timer-container"><div id="timer-bar"></div></div>
        <h2 id="question-text" style="font-size: 18px; margin-bottom: 20px;"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 id="txt-finish">Finished!</h1>
        <p id="final-score" style="font-size: 48px; color: #00f2ff; font-weight: bold;"></p>
        <p id="tx-status" style="color: #00ff88;">Sending result to GenLayer...</p>
    </div>
</div>

<div class="lang-bar">
    <button class="lang-btn active" id="l-ua" onclick="setLang('UA')">🇺🇦 UA</button>
    <button class="lang-btn" id="l-en" onclick="setLang('EN')">🇺🇸 EN</button>
    <button class="lang-btn" id="l-tr" onclick="setLang('TR')">🇹🇷 TR</button>
    <button class="lang-btn" id="l-es" onclick="setLang('ES')">🇪🇸 ES</button>
    <button class="lang-btn" id="l-fr" onclick="setLang('FR')">🇫🇷 FR</button>
</div>

<script>
    let currentLang = 'UA';
    let userAddress = "";
    let currentQ = 0;
    let score = 0;
    let timer;
    let timeLeft = 25;

    const GENLAYER_STUDIO_CONFIG = {
        chainId: '0xF22F', 
        chainName: 'GenLayer Studio',
        rpcUrls: ['https://studio.genlayer.com/api'],
        nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
        blockExplorerUrls: [] 
    };

    const translations = {
        UA: { title: "David Johnston Quiz", desc: "Експертний квіз по інтерв'ю", wallet: "Підключити GenLayer Studio", start: "ПОЧАТИ", finish: "Готово!", tx: "Надсилання в GenLayer..." },
        EN: { title: "David Johnston Quiz", desc: "Expert interview quiz", wallet: "Connect GenLayer Studio", start: "START", finish: "Finished!", tx: "Sending to GenLayer..." },
        TR: { title: "David Johnston Quiz", desc: "Uzman mülakat testi", wallet: "GenLayer Studio'yu Bağla", start: "BAŞLAT", finish: "Bitti!", tx: "GenLayer'a gönderiliyor..." },
        ES: { title: "Quiz David Johnston", desc: "Quiz de entrevista experta", wallet: "Conectar GenLayer Studio", start: "EMPEZAR", finish: "¡Terminado!", tx: "Enviando a GenLayer..." },
        FR: { title: "Quiz David Johnston", desc: "Quiz interview d'expert", wallet: "Connecter GenLayer Studio", start: "COMMENCER", finish: "Terminé!", tx: "Envoi à GenLayer..." }
    };

    const questions = [
        {
            UA: "Чому Девід вважає, що у світі блокчейну значно менше суперечок?",
            EN: "Why does David think there are fewer disputes in the blockchain world?",
            TR: "David neden blockchain dünyasında daha az anlaşmazlık olduğunu düşünüyor?",
            ES: "¿Por qué David cree que hay menos disputas en el mundo blockchain?",
            FR: "Pourquoi David pense-t-il qu'il y a moins de litiges dans le monde blockchain?",
            a: {
                UA: ["Адвокати працюють швидше", "Смарт-контракти детерміновані та виконуються автоматично", "Суперечки вирішують ШІ-судді", "Транзакції занадто дорогі для конфліктів"],
                EN: ["Lawyers work faster", "Smart contracts are deterministic and execute automatically", "Disputes resolved by AI judges", "Transactions are too expensive"],
                TR: ["Avukatlar daha hızlı", "Akıllı sözleşmeler otomatiktir", "Yapay zeka yargıçları çözer", "İşlemler çok pahalı"],
                ES: ["Abogados rápidos", "Contratos deterministas", "Jueces de IA", "Transacciones caras"],
                FR: ["Avocats rapides", "Contrats déterministes", "Juges IA", "Transactions chères"]
            }, c: 1
        },
        {
            UA: "Що таке «трагедія спільного» в контексті ШІ за Девідом?",
            EN: "What is the “tragedy of the commons” in AI according to David?",
            TR: "David'e göre yapay zekada “ortak malların trajedisi” nedir?",
            ES: "¿Qué es la “tragedia de los comunes” en IA según David?",
            FR: "Qu'est-ce que la « tragédie des communs » dans l'IA selon David?",
            a: {
                UA: ["Відсутність стандартів коду", "Монополія великих компаній", "Ресурси перевантажені, бо нікому не належать; децентралізація дає особисту власність", "Високі комісії"],
                EN: ["Lack of code standards", "Big tech monopoly", "Resources overloaded because no one owns them; decentralization fixes this", "High fees"],
                TR: ["Kod standartları eksikliği", "Tekelcilik", "Kaynaklar sahipsiz olduğu için aşırı yüklü; merkeziyetsizlik çözer", "Yüksek ücretler"],
                ES: ["Falta de estándares", "Monopolio tecnológico", "Recursos sobrecargados; la descentralización lo soluciona", "Comisiones altas"],
                FR: ["Manque de standards", "Monopole technologique", "Ressources surchargées ; la décentralisation règle ça", "Frais élevés"]
            }, c: 2
        },
        {
            UA: "Як влаштовано управління в системі Morpheus?",
            EN: "How is governance arranged in the Morpheus system?",
            TR: "Morpheus sisteminde yönetişim nasıl düzenlenir?",
            ES: "¿Cómo se organiza la gobernanza en Morpheus?",
            FR: "Comment la gouvernance est-elle organisée dans Morpheus?",
            a: {
                UA: ["Голосування в DAO", "Централізовано компанією", "Комітет з етики ШІ", "Атомне управління: кожен користувач обирає компоненти індивідуально"],
                EN: ["DAO voting", "Centralized by company", "AI ethics committee", "Atomic governance: users choose components individually"],
                TR: ["DAO oylaması", "Şirket tarafından merkezi", "Yapay zeka etik komitesi", "Atomik yönetişim: kullanıcılar bileşenleri seçer"],
                ES: ["Votación DAO", "Centralizada", "Comité de ética", "Gobernanza atómica: el usuario elige"],
                FR: ["Vote DAO", "Centralisée", "Comité d'éthique", "Gouvernance atomique : l'utilisateur choisit"]
            }, c: 3
        },
        {
            UA: "Які три реєстри передбачає стандарт ERC-8004?",
            EN: "What three registries does ERC-8004 provide?",
            TR: "ERC-8004 hangi üç kaydı sağlar?",
            ES: "¿Qué tres registros proporciona ERC-8004?",
            FR: "Quels sont les trois registres d'ERC-8004 ?",
            a: {
                UA: ["Попит, пропозиція, ліквідність", "Ідентифікація, валідація, репутація", "Токени, гаманці, контракти", "Приватність, безпека, масштабованість"],
                EN: ["Demand, supply, liquidity", "Identification, validation, reputation", "Tokens, wallets, contracts", "Privacy, security, scalability"],
                TR: ["Talep, arz, likidite", "Kimlik, doğrulama, itibar", "Token, cüzdan, sözleşme", "Gizlilik, güvenlik, ölçeklenebilirlik"],
                ES: ["Demanda, oferta", "Identidad, validación, reputación", "Tokens, billeteras", "Privacidad, seguridad"],
                FR: ["Demande, offre", "Identité, validation, réputation", "Tokens, portefeuilles", "Vie privée, sécurité"]
            }, c: 1
        },
        {
            UA: "Вирішальний фактор конфліктів за ERC-8004?",
            EN: "Decisive factor for agent conflicts in ERC-8004?",
            TR: "ERC-8004'te ajan çatışmaları için belirleyici faktör nedir?",
            ES: "¿Factor decisivo en conflictos según ERC-8004?",
            FR: "Facteur décisif pour les conflits d'agents dans ERC-8004 ?",
            a: {
                UA: ["Кількість підписників", "Обсяг коду", "Репутація на основі он-чейн активності", "Країна реєстрації"],
                EN: ["Subscribers count", "Amount of code", "Reputation based on on-chain activity", "Country of registration"],
                TR: ["Takipçi sayısı", "Kod miktarı", "Zincir içi aktiviteye dayalı itibar", "Kayıtlı olduğu ülke"],
                ES: ["Suscriptores", "Cantidad de código", "Reputación on-chain", "País de registro"],
                FR: ["Abonnés", "Quantité de code", "Réputation on-chain", "Pays d'enregistrement"]
            }, c: 2
        },
        {
            UA: "Скільки мов мають підтримувати агенти для масовості?",
            EN: "How many languages should agents support for mass adoption?",
            TR: "Kitlesel benimseme için ajanlar kaç dili desteklemelidir?",
            ES: "¿Cuántos idiomas deben soportar los agentes?",
            FR: "Combien de langues les agents doivent-ils supporter ?",
            a: {
                UA: ["Тільки англійська", "Тільки мови G7", "Мінімум 5 основних мов", "Усі 7000+ мов світу"],
                EN: ["Only English", "Only G7 languages", "At least 5 major world languages", "All 7000+ languages"],
                TR: ["Sadece İngilizce", "Sadece G7 dilleri", "En az 5 ana dünya dili", "Dünyadaki tüm diller"],
                ES: ["Solo inglés", "Solo G7", "Al menos 5 idiomas principales", "Todos los idiomas"],
                FR: ["Seulement l'anglais", "Seulement le G7", "Au moins 5 langues majeures", "Toutes les langues"]
            }, c: 2
        },
        {
            UA: "Як вирішити «проблему холодного старту» агентів?",
            EN: "How to solve the 'cold start problem' for AI agents?",
            TR: "Yapay zeka ajanları için 'soğuk başlangıç' sorunu nasıl çözülür?",
            ES: "¿Cómo solucionar el 'problema de inicio en frío'?",
            FR: "Comment résoudre le 'problème de démarrage à froid' ?",
            a: {
                UA: ["Великий депозит", "Початковий рейтинг авансом", "Блокування до верифікації", "Нижчі комісії (1% замість 5%) та реальна цінність"],
                EN: ["Large deposit", "Initial rating upfront", "Block until verification", "Lower fees (1% vs 5%) and real value"],
                TR: ["Büyük depozito", "Önceden itibar", "Doğrulama gelene kadar blok", "Düşük ücretler (%1) ve gerçek değer"],
                ES: ["Depósito grande", "Calificación inicial", "Bloqueo", "Comisiones bajas (1%) y valor real"],
                FR: ["Dépôt important", "Évaluation initiale", "Blocage", "Frais réduits (1%) et valeur réelle"]
            }, c: 3
        },
        {
            UA: "Історичний приклад Девіда для нових агентів?",
            EN: "David's historical example for new agents?",
            TR: "David'in yeni ajanlar için tarihsel örneği nedir?",
            ES: "¿Ejemplo histórico de David para los agentes?",
            FR: "Exemple historique de David pour les agents ?",
            a: {
                UA: ["Поштові служби", "Bitcoin у 2012 році", "Картки Visa", "Перший браузер"],
                EN: ["Postal services", "Bitcoin in 2012", "Visa cards", "First browser"],
                TR: ["Posta servisleri", "2012'de Bitcoin", "Visa kartları", "İlk tarayıcı"],
                ES: ["Correos", "Bitcoin en 2012", "Tarjetas Visa", "Primer navegador"],
                FR: ["Services postaux", "Bitcoin en 2012", "Cartes Visa", "Premier navigateur"]
            }, c: 1
        },
        {
            UA: "Роль Morpheus для Akash чи Bittensor?",
            EN: "Morpheus's role for Akash or Bittensor?",
            TR: "Morpheus'un Akash veya Bittensor için rolü nedir?",
            ES: "¿Rol de Morpheus para Akash o Bittensor?",
            FR: "Rôle de Morpheus pour Akash ou Bittensor ?",
            a: {
                UA: ["Конкуренція", "Аудитор", "Сторона попиту (Demand side) через MVM", "Заміна інфраструктури"],
                EN: ["Competition", "Auditor", "Demand side via MVM", "Infrastructure replacement"],
                TR: ["Rekabet", "Denetçi", "MVM aracılığıyla talep tarafı", "Altyapı değişimi"],
                ES: ["Competencia", "Auditor", "Lado de la demanda vía MVM", "Reemplazo"],
                FR: ["Compétition", "Auditeur", "Côté demande via MVM", "Remplacement"]
            }, c: 2
        },
        {
            UA: "Мета «атомного управління»?",
            EN: "Goal of 'atomic governance'?",
            TR: "Atomik yönetişimin amacı nedir?",
            ES: "¿Objetivo de la gobernanza atómica?",
            FR: "But de la gouvernance atomique ?",
            a: {
                UA: ["Більше бюрократії", "Контроль урядів", "Уникнення політики, фокус на цінності для особистості", "Світовий уряд для ШІ"],
                EN: ["More bureaucracy", "Government control", "Avoiding politics, focus on individual value", "World government for AI"],
                TR: ["Daha fazla bürokrasi", "Hükümet kontrolü", "Siyasetten kaçınma, bireysel değere odaklanma", "Dünya hükümeti"],
                ES: ["Más burocracia", "Control gubernamental", "Evitar política, valor individual", "Gobierno mundial"],
                FR: ["Plus de bureaucratie", "Contrôle gouvernemental", "Éviter la politique, valeur individuelle", "Gouvernement mondial"]
            }, c: 2
        }
    ];

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask!");
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: GENLAYER_STUDIO_CONFIG.chainId }],
                });
            } catch (err) {
                if (err.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [GENLAYER_STUDIO_CONFIG],
                    });
                }
            }
            userAddress = accounts[0];
            document.getElementById('wallet-btn').innerText = "Studio Connected";
            document.getElementById('start-quiz-btn').disabled = false;
        } catch (e) { console.error(e); }
    }

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('l-' + lang.toLowerCase()).classList.add('active');
        const t = translations[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-desc').innerText = t.desc;
        document.getElementById('start-quiz-btn').innerText = t.start;
        document.getElementById('wallet-btn').innerText = userAddress ? "Connected" : t.wallet;
        document.getElementById('txt-finish').innerText = t.finish;
        document.getElementById('tx-status').innerText = t.tx;
        if(document.getElementById('quiz-screen').style.display === 'block') updateQuestionUI();
    }

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timer);
        timeLeft = 25;
        updateQuestionUI();
        updateTimer();
        timer = setInterval(() => {
            timeLeft--;
            updateTimer();
            if (timeLeft <= 0) handleAnswer(-1);
        }, 1000);
    }

    function updateQuestionUI() {
        const q = questions[currentQ];
        document.getElementById('progress').innerText = (currentLang === 'UA' ? "Питання " : "Question ") + (currentQ + 1) + " / 10";
        document.getElementById('question-text').innerText = q[currentLang];
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.a[currentLang].forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => handleAnswer(i);
            container.appendChild(b);
        });
    }

    function updateTimer() { document.getElementById('timer-bar').style.width = (timeLeft / 25 * 100) + "%"; }

    function handleAnswer(idx) {
        if (idx === questions[currentQ].c) score++;
        currentQ++;
        if (currentQ < 10) showQuestion();
        else finish();
    }

    async function finish() {
        clearInterval(timer);
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 10`;
        
        if (userAddress) {
            try {
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        to: "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383",
                        from: userAddress,
                        value: '0x0',
                        data: '0x' + btoa("Result:" + score).split('').map(c=>c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
                    }]
                });
            } catch (e) { console.error(e); }
        }
    }
    setLang('UA');
</script>
</body>
</html>
