<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz | David Johnston Interview</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; width: 90%; font-size: 16px; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #888; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        .timer-bar { height: 5px; background: #00f2ff; width: 100%; transition: width 1s linear; margin-bottom: 20px; }
        .status-ok { color: #00ff88; font-size: 14px; display: none; margin-top: 10px; font-weight: bold; }
        #progress { color: #00f2ff; margin-bottom: 10px; font-weight: bold; }
        .lang-bar { padding: 15px; background: #111; border-top: 1px solid #222; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Header" class="banner">
    
    <div id="start-screen">
        <h1 id="txt-title">David Johnston Quiz</h1>
        <p>10 питань про децентралізований ШІ</p>
        <button class="btn" id="wallet-btn" onclick="connectWallet()">Підключити гаманець</button>
        <p id="wallet-status" class="status-ok">✔ Гаманець підключено</p>
        <br>
        <button class="btn" id="start-quiz-btn" disabled onclick="startQuiz()" style="background: #ff0055; color: #fff;">ПОЧАТИ КВІЗ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress">Питання 1 / 10</div>
        <div class="timer-bar" id="timer"></div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1>Результат</h1>
        <p id="final-score" style="font-size: 40px; color: #00f2ff; font-weight: bold;"></p>
        <p id="tx-info">Підпишіть транзакцію для збереження результату...</p>
    </div>
</div>

<div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('UA')">🇺🇦 UA</button>
    <button class="lang-btn" onclick="setLang('EN')">🇺🇸 EN</button>
</div>

<script>
    let currentLang = 'UA';
    let userAddress = "";
    let currentQ = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15;

    const questions = [
        {
            UA: "З якою системою Девід порівнює централізований ШІ?",
            EN: "What system does David compare centralized AI to?",
            a: ["Римська імперія", "Радянський Союз", "Федеральний резерв", "Силіконова долина"],
            c: 1
        },
        {
            UA: "Яка головна мета Девіда при виборі технологій?",
            EN: "What is David's main goal when choosing technologies?",
            a: ["Максимальний прибуток", "Швидкість транзакцій", "Збільшення свободи людини", "Складна математика"],
            c: 2
        },
        {
            UA: "Що Девід називає новим 'вузьким місцем' (bottleneck)?",
            EN: "What does David call the new 'bottleneck'?",
 a: ["Потужність GPU", "Швидкість інтернету", "Опис намірів (agency describing)", "Вартість енергії"],
            c: 2
        },
        {
            UA: "Скільки агентів Девід хоче запустити до кінця року?",
            EN: "How many agents does David want to run by the end of the year?",
            a: ["10", "100", "500", "1000"],
            c: 1
        },
        {
            UA: "Що таке 'Johnston’s Law' (Закон Джонстона)?",
            EN: "What is 'Johnston’s Law'?",
            a: ["ШІ замінить усіх", "Все, що може бути децентралізоване, буде децентралізоване", "Біткоїн — це майбутнє", "Роботи потребують прав"],
            c: 1
        },
        {
            UA: "Яке співвідношення ШІ-інтелекту до людського прогнозує Девід?",
            EN: "What AI-to-human brain power ratio does David predict?",
            a: ["У 2 рази більше", "У 5 разів більше", "У 100 разів більше", "Однаково"],
            c: 1
        },
        {
            UA: "Чому Девід вважає ШІ та Блокчейн ідеальною парою?",
            EN: "Why does David think AI and Blockchain are a perfect match?",
            a: ["Це просто хайп", "ШІ потрібна програмована валюта (crypto)", "Для захисту від хакерів", "Для майнінгу"],
            c: 1
        },
        {
            UA: "Як називається інфраструктурний шар для агентів, про який він згадує?",
            EN: "What is the name of the infrastructure layer for agents he mentions?",
            a: ["Ethereum", "Morpheus", "Bitcoin", "Claude"],
            c: 1
        },
        {
            UA: "Що Девід вважає 'найбільш обмеженою річчю' у світі сьогодні?",
            EN: "What does David consider the 'most restricted thing' in the world today?",
            a: ["Інтернет", "Гроші (фінанси)", "Освіта", "Їжа"],
            c: 1
        },
        {
            UA: "Який стандарт платежів для агентів він виділяє (разом з Coinbase)?",
            EN: "What agent payment standard does he highlight (with Coinbase)?",
            a: ["ERC-20", "Lightning Network", "x402", "ISO20022"],
            c: 2
        }
    ];

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(lang)));
    }

    async function connectWallet() {
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            document.getElementById('wallet-status').style.display = 'block';
            document.getElementById('start-quiz-btn').disabled = false;
        }
    }

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timerInterval);
        timeLeft = 15;
        updateTimerBar();

        document.getElementById('progress').innerText = Питання ${currentQ + 1} / 10;
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q[currentLang];
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => selectOption(i);
            container.appendChild(b);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerBar();
            if (timeLeft <= 0) selectOption(-1);
        }, 1000);
    }

    function updateTimerBar() {
        document.getElementById('timer').style.width = (timeLeft / 15 * 100) + "%";
    }

    function selectOption(idx) {
        clearInterval(timerInterval);
        if (idx === questions[currentQ].c) score++;
        
        currentQ++;
        if (currentQ < 10) showQuestion();
        else finish();
    }
    async function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = ${score} / 10;

        try {
            const txParams = {
                to: "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383",
                from: userAddress,
                value: '0x0',
                data: '0x' + btoa("QuizScore:" + score).split('').map(c=>c.charCodeAt(0).toString(16)).join('')
            };
            await window.ethereum.request({ method: 'eth_sendTransaction', params: [txParams] });
            document.getElementById('tx-info').innerText = "Результат записано в GenLayer!";
        } catch (e) {
            document.getElementById('tx-info').innerText = "Транзакція не підписана.";
        }
    }
</script>
</body>
</html>
