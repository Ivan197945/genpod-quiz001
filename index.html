<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - David Johnston Interview</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; width: 90%; font-size: 16px; display: inline-block; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #888; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; font-size: 16px; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        .timer-container { width: 100%; background: #222; height: 8px; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        #timer-bar { background: #00f2ff; height: 100%; width: 100%; transition: width 1s linear; }
        #progress { color: #00f2ff; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
        .lang-bar { padding: 15px; background: #111; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Banner" class="banner">
    
    <div id="start-screen">
        <h1 id="txt-title">David Johnston Quiz</h1>
        <p id="txt-desc">Експертний квіз за матеріалами інтерв'ю</p>
        <button class="btn" id="wallet-btn" onclick="connectWallet()">Підключити GenLayer Studio</button>
        <button class="btn" id="start-quiz-btn" disabled onclick="startQuiz()" style="margin-top:20px; background:#ff0055; color:#fff;">ПОЧАТИ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress">Питання 1 / 10</div>
        <div class="timer-container"><div id="timer-bar"></div></div>
        <h2 id="question-text" style="font-size: 20px;"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 id="txt-finish">Готово!</h1>
        <p id="final-score" style="font-size: 48px; color: #00f2ff; font-weight: bold;"></p>
        <p id="tx-status" style="color: #00ff88;">Надсилання результату в GenLayer Studio...</p>
    </div>
</div>

<div class="lang-bar">
    <button class="lang-btn active" id="l-ua" onclick="setLang('UA')">🇺🇦 UA</button>
    <button class="lang-btn" id="l-en" onclick="setLang('EN')">🇺🇸 EN</button>
</div>

<script>
    let currentLang = 'UA';
    let userAddress = "";
    let currentQ = 0;
    let score = 0;
    let timer;
    let timeLeft = 20; // Збільшено час через довжину питань

    const GENLAYER_STUDIO_CONFIG = {
        chainId: '0xF22F', 
        chainName: 'GenLayer Studio',
        rpcUrls: ['https://studio.genlayer.com/api'],
        nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
        blockExplorerUrls: [] 
    };

    const questions = [
        {
            EN: "Why does David think there are significantly fewer disputes in the blockchain world than in the traditional world?",
            UA: "Чому Девід вважає, що у світі блокчейну значно менше суперечок, ніж у традиційному світі?",
            a: ["Because blockchain lawyers work much faster", "Because smart contracts are deterministic and always execute automatically", "Because all disputes are resolved instantly by AI judges", "Because transactions are too expensive to create conflict"],
            c: 1
        },
        {
            EN: "What does David mean by the “tragedy of the commons” in the context of AI?",
            UA: "Що Девід має на увазі під «трагедією спільного» в контексті ШІ?",
            a: ["The lack of uniform coding standards", "The problem of a few large companies monopolizing the internet", "Resources are overloaded because they are not owned by anyone; decentralization solves this via personal ownership", "Inflated fees in traditional financial systems"],
            c: 2
        },
        {
            EN: "How is governance arranged in the Morpheus system?",
            UA: "Як влаштовано управління (governance) в системі Morpheus?",
            a: ["All decisions are made by voting within the Morpheus DAO", "Governance is centralized through the Morpheus Company", "Governance is handled by an AI ethics committee", "There is no company or DAO; there is “atomic governance” where each user chooses components"],
            c: 3
        },
        {
            EN: "What three key registries does the ERC-8004 standard provide for AI agents?",
            UA: "Які три ключові реєстри передбачає стандарт ERC-8004 для ШІ-агентів?",
            a: ["Demand, supply, and liquidity", "Identification, validation, and reputation", "Tokens, wallets, and smart contracts", "Privacy, security, and scalability"],
            c: 1
        },
        {
            EN: "What is the decisive factor for resolving agent conflicts according to the ERC-8004 standard?",
            UA: "Який вирішальний фактор для вирішення конфліктів агентів згідно зі стандартом ERC-8004?",
            a: ["The number of subscribers of the developer", "The amount of code written for the agent", "Reputation based on real on-chain activity and transactions", "The country of registration of the agent owner"],
            c: 2
        },
        {
            EN: "How many major languages should agents support for mass adoption in the world?",
            UA: "Скільки основних мов мають підтримувати агенти для масового впровадження у світі?",
            a: ["Only English", "Only G7 countries languages", "At least 5 major world languages to ensure accessibility", "All 7000+ languages simultaneously"],
            c: 2
        },
        {
            EN: "How is it proposed to solve the 'cold start problem' for new AI agents?",
            UA: "Як пропонується вирішити «проблему холодного старту» для нових ШІ-агентів?",
            a: ["Require developers to pay a large deposit", "Provide them with an initial rating upfront", "Block transactions until human verification", "Incentivize users with lower fees (e.g. 1% instead of 5%) and real value"],
            c: 3
        },
        {
            EN: "What historical example does David give, comparing it to the stage of development of new AI agents?",
            UA: "Який історичний приклад наводить Девід, порівнюючи його з етапом розвитку нових ШІ-агентів?",
            a: ["The development of the first postal services", "Bitcoin in 2012, when the system was small but had potential", "Creation of the first Visa bank cards", "The emergence of the first graphical browser"],
            c: 1
        },
        {
            EN: "What role does Morpheus play in relation to projects such as Akash or Bittensor?",
            UA: "Яку роль відіграє Morpheus по відношенню до таких проєктів, як Akash або Bittensor?",
            a: ["Morpheus competes with them for computing power", "Morpheus is their main auditor", "Morpheus acts as a 'demand side', connecting users via MVM", "Morpheus replaces these projects"],
            c: 2
        },
        {
            EN: "What is the main goal of 'atomic governance' in decentralized AI?",
            UA: "Яка основна мета «атомного управління» у децентралізованому ШІ?",
            a: ["To increase bureaucratic procedures", "To enable governments to control AI", "To avoid wasting time on politics and courts, focusing on value for the individual", "To create a single world government for AI"],
            c: 2
        }
    ];

    async function connectWallet() {
        if (!window.ethereum) return alert("Встановіть гаманець!");
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: GENLAYER_STUDIO_CONFIG.chainId }],
                });
            } catch (err) {
                if (err.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [GENLAYER_STUDIO_CONFIG],
                    });
                }
            }
            userAddress = accounts[0];
            document.getElementById('wallet-btn').innerText = "OK: " + userAddress.substring(0,6);
            document.getElementById('start-quiz-btn').disabled = false;
        } catch (e) { console.error(e); }
    }

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('l-' + lang.toLowerCase()).classList.add('active');
        const labels = { UA: { t: "David Johnston Quiz", s: "ПОЧАТИ" }, EN: { t: "David Johnston Quiz", s: "START" } };
        document.getElementById('txt-title').innerText = labels[lang].t;
        document.getElementById('start-quiz-btn').innerText = labels[lang].s;
    }

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timer);
        timeLeft = 20;
        const q = questions[currentQ];
        document.getElementById('progress').innerText = `Question ${currentQ + 1} / 10`;
        document.getElementById('question-text').innerText = q[currentLang];
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => handleAnswer(i);
            container.appendChild(b);
        });
        updateTimer();
        timer = setInterval(() => {
            timeLeft--;
            updateTimer();
            if (timeLeft <= 0) handleAnswer(-1);
        }, 1000);
    }

    function updateTimer() { document.getElementById('timer-bar').style.width = (timeLeft / 20 * 100) + "%"; }

    function handleAnswer(idx) {
        if (idx === questions[currentQ].c) score++;
        currentQ++;
        if (currentQ < 10) showQuestion();
        else finish();
    }

    async function finish() {
        clearInterval(timer);
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 10`;
        
        if (userAddress) {
            try {
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        to: "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383",
                        from: userAddress,
                        value: '0x0',
                        data: '0x' + btoa("Result:" + score).split('').map(c=>c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
                    }]
                });
            } catch (e) { console.error(e); }
        }
    }
</script>
</body>
</html>
