<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; width: 90%; font-size: 16px; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #888; }
        .btn-x { background: #fff; color: #000; }
        .btn-discord { background: #5865F2; color: #fff; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        .verification-step { background: #111; padding: 15px; border-radius: 10px; margin: 10px 0; border: 1px solid #222; }
        .status-ok { color: #00ff88; font-size: 14px; display: none; margin-top: 10px; font-weight: bold; }
        .lang-bar { padding: 15px; background: #111; display: flex; justify-content: center; gap: 10px; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Header" class="banner">
    
    <div id="start-screen">
        <h1>Ласкаво просимо до вікторини GenPod</h1>
        <p style="color: #00f2ff;">Виконайте ОДНУ будь-яку дію для розблокування:</p>
        
        <div class="verification-step">
            <button class="btn" id="wallet-btn" onclick="connectWallet()">1. Підключити гаманець</button>
            <p id="wallet-status" class="status-ok">✔ Гаманець підключено</p>
        </div>

        <div class="verification-step">
            <button class="btn btn-x" id="x-btn" onclick="linkX()">2. Слідкуйте за X (Twitter)</button>
            <p id="x-status" class="status-ok">✔ X підключено</p>
        </div>

        <div class="verification-step">
            <button class="btn btn-discord" id="dc-btn" onclick="linkDC()">3. Приєднатися до Discord</button>
            <p id="dc-status" class="status-ok">✔ Discord підключено</p>
        </div>

        <button class="btn" id="start-quiz-btn" disabled onclick="startQuiz()" style="margin-top: 20px; background: #ff0055; color: #fff;">ПОЧАТИ ВІКТОРИНУ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1>Вікторину завершено!</h1>
        <p id="final-score" style="font-size: 40px; color: #00f2ff;"></p>
        <p id="tx-status" style="color: #00ff88;">Надсилання транзакції в GenLayer...</p>
    </div>
</div>

<script>
    let unlocked = false;
    let userAddress = "";
    const contractAddr = "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383";

    function unlock() {
        unlocked = true;
        document.getElementById('start-quiz-btn').disabled = false;
    }

    async function connectWallet() {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                document.getElementById('wallet-btn').innerText = "Підключено: " + userAddress.substring(0,6) + "...";
                document.getElementById('wallet-status').style.display = 'block';
                unlock();
            } catch (e) { alert("Помилка підключення"); }
        } else { alert("Встановіть MetaMask!"); }
    }

    function linkX() {
        window.open('https://x.com/GenLayer', '_blank');
        let nick = prompt("Введіть ваш нік у X (@username):");
        if(nick) {
            document.getElementById('x-status').innerText = "✔ Підключено: " + nick;
            document.getElementById('x-status').style.display = 'block';
            unlock();
        }
    }

    function linkDC() {
        window.open('https://discord.gg/genlayer', '_blank');
        let nick = prompt("Введіть ваш Discord нік:");
        if(nick) {
            document.getElementById('dc-status').innerText = "✔ Підключено: " + nick;
            document.getElementById('dc-status').style.display = 'block';
            unlock();
        }
    }

    // Логіка квізу (спрощена для прикладу)
    let score = 0;
    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('question-text').innerText = "Яка головна мета Девіда Джонстона?";
        const container = document.getElementById('options-container');
        const options = ["Прибуток", "Свобода людини", "Регуляції"];
        options.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => { if(i === 1) score = 1; finish(); };
            container.appendChild(b);
        });
    }

    async function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score + " / 1";
        
        if (window.ethereum && userAddress) {
            try {
                const txParams = {
                    to: contractAddr,
                    from: userAddress,
                    value: '0x0',
                    data: '0x' + btoa("Score:" + score).split('').map(c=>c.charCodeAt(0).toString(16)).join('')
                };
                await window.ethereum.request({ method: 'eth_sendTransaction', params: [txParams] });
                document.getElementById('tx-status').innerText = "Транзакція успішна!";
            } catch (e) { document.getElementById('tx-status').innerText = "Транзакція скасована"; }
        }
    }
</script>
</body>
</html>
