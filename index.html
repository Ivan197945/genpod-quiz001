<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - GenLayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .container { max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #333; border-radius: 20px; }
        .btn { display: block; width: 100%; margin: 10px 0; padding: 15px; background: #111; color: #fff; border: 1px solid #444; border-radius: 10px; cursor: pointer; }
        .btn:hover { border-color: #00f2ff; }
        .lang-bar { margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="game">
        <h2 id="q-text">Підключіть гаманець для початку</h2>
        <div id="options">
            <button class="btn" onclick="connect()">🦊 Підключити GenLayer</button>
        </div>
    </div>
</div>

<div class="lang-bar">
    <button onclick="setLang('UA')">UA</button>
    <button onclick="setLang('EN')">EN</button>
    <button onclick="setLang('TR')">TR</button>
    <button onclick="setLang('ES')">ES</button>
    <button onclick="setLang('FR')">FR</button>
</div>

<script>
    const questions = [
        { q: "Яка місія GenPod?", a: ["Ігри", "ШІ-агенти", "NFT", "Майнінг"], c: 1 },
        { q: "Хто лідер проекту?", a: ["Джонстон", "Маск", "Бутерін", "Сатоші"], c: 0 },
        { q: "Що таке Intelligent Contracts?", a: ["Код", "ШІ-контракти", "Папір", "Скрипти"], c: 1 },
        { q: "Проблема Web2 ШІ?", a: ["Цензура", "Швидкість", "Ціна", "Дизайн"], c: 0 },
        { q: "Що таке Hallucination?", a: ["Вигадка фактів", "Швидкість", "Дизайн", "Помилка"], c: 0 },
        { q: "Інтерактивність GenPod?", a: ["ШІ-діалог", "Відео", "Звук", "Підписка"], c: 0 },
        { q: "Консенсус GenLayer?", a: ["PoW", "Optimistic Execution", "PoS", "Delegation"], c: 1 },
        { q: "Взаємодія з користувачем?", a: ["Гаманець", "Код", "Сервер", "Дозвіл"], c: 0 },
        { q: "Важливість децентралізації?", a: ["Цензура", "Незалежність", "Реклама", "Дані"], c: 1 },
        { q: "Майбутнє?", a: ["Web3+AI", "Ніколи", "Зараз", "Пізніше"], c: 0 }
    ];

    let score = 0, currentQ = 0, signer;

    async function connect() {
        if (!window.ethereum) return alert("Гаманець не знайдено");
        await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{
            chainId: "0x107d", chainName: "GenLayer Testnet",
            rpcUrls: ["https://zksync-os-testnet-genlayer.zksync.dev"],
            nativeCurrency: { name: "GEN", symbol: "GEN", decimals: 18 }
        }]});
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        loadQ();
    }

    function loadQ() {
        if (currentQ >= questions.length) return finish();
        let q = questions[currentQ];
        document.getElementById("q-text").innerText = q.q;
        let html = "";
        q.a.forEach((opt, i) => html += `<button class="btn" onclick="check(${i})">${opt}</button>`);
        document.getElementById("options").innerHTML = html;
    }

    function check(i) {
        if (i === questions[currentQ].c) score++;
        currentQ++;
        loadQ();
    }

    async function finish() {
        document.getElementById("q-text").innerText = "Результат: " + score + "/10";
        document.getElementById("options").innerHTML = `<button class="btn" onclick="sign()">ПІДПИСАТИ В GENLAYER</button>`;
    }

    async function sign() {
        const contract = new ethers.Contract("0x6911e189a3558Bf5c0721AA234C80AaF17cFa383", ["function submitScore(uint256)"], signer);
        const tx = await contract.submitScore(score);
        alert("Транзакція надіслана: " + tx.hash);
    }
    
    function setLang(l) { alert("Мову змінено на " + l); }
</script>
</body>
</html>
