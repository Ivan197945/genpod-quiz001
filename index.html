<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Interview Quiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 30px auto; padding: 20px; background: #0a0a0a; border-radius: 20px; border: 1px solid #1f1f1f; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        
        /* Вибір гаманця */
        .wallet-box { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .w-btn { display: flex; align-items: center; justify-content: center; gap: 12px; background: #161616; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .w-btn:hover { border-color: #00f2ff; background: #1c1c1c; }
        
        .btn-action { background: #00f2ff; border: none; color: #000; padding: 16px; font-weight: bold; cursor: pointer; border-radius: 30px; width: 100%; font-size: 18px; margin-top: 10px; }
        .btn-action:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        .option-btn { display: block; width: 100%; background: #111; color: #fff; border: 1px solid #222; padding: 15px; margin: 8px 0; border-radius: 12px; cursor: pointer; text-align: left; font-size: 15px; }
        .option-btn:hover { border-color: #00f2ff; background: #161616; }
        
        #timer { font-size: 32px; color: #ff0055; font-weight: bold; margin: 10px 0; }
        .lang-bar { margin-top: 20px; display: flex; justify-content: center; gap: 8px; padding-bottom: 30px; }
        .lang-item { background: #111; border: 1px solid #333; color: #777; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .lang-item.active { border-color: #00f2ff; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" class="banner" alt="GenPod Banner">

    <div id="start-screen">
        <h1 id="txt-title">GenPod Interview Quiz</h1>
        <p id="txt-subtitle">Підключіть гаманець мережі GenLayer</p>
        
        <div class="wallet-box" id="selector">
            <button class="w-btn" onclick="connect('metamask')">🦊 MetaMask</button>
            <button class="w-btn" onclick="connect('okx')">🖤 OKX Wallet</button>
            <button class="w-btn" onclick="connect('rabby')">💙 Rabby Wallet</button>
        </div>

        <p id="status" style="color: #00f2ff; display:none; font-weight: bold;">✓ Підключено</p>
        <button class="btn-action" id="start-btn" disabled onclick="begin()">ПОЧАТИ КВІЗ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress" style="color: #666; font-size: 14px;">Питання 1 / 10</div>
        <div id="timer">15</div>
        <h2 id="q-text" style="font-size: 20px; min-height: 60px;"></h2>
        <div id="options"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1>Завершено!</h1>
        <div id="score-display" style="font-size: 60px; color: #00f2ff; font-weight: bold; margin: 20px 0;">0 / 10</div>
        <button class="btn-action" id="save-btn" onclick="sendToBlockchain()">ЗБЕРЕГТИ В GENLAYER</button>
    </div>
</div>

<div class="lang-bar">
    <div class="lang-item active" onclick="changeLang('UA')">UA</div>
    <div class="lang-item" onclick="changeLang('EN')">EN</div>
    <div class="lang-item" onclick="changeLang('TR')">TR</div>
    <div class="lang-item" onclick="changeLang('ES')">ES</div>
    <div class="lang-item" onclick="changeLang('FR')">FR</div>
</div>

<script>
    const CONTRACT = "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383";
    const GEN_CHAIN_ID = "0x65"; // Chain ID для GenLayer (101)
    
    let currentLang = 'UA';
    let signer = null;
    let score = 0;
    let currentQ = 0;
    let timer;

    // 10 питань на тему GenPod / Interview
    const quizData = [
        { UA: {q: "Яка головна місія проекту GenPod?", a: ["Створення ігор", "Децентралізовані ШІ-агенти", "Продаж NFT", "Майнінг"], c: 1}, EN: {q: "Main GenPod mission?", a: ["Gaming", "Decentralized AI Agents", "NFT sales", "Mining"], c: 1} },
        { UA: {q: "Хто такий Девід Джонстон у контексті проекту?", a: ["Модератор", "Керівник (Lead)", "Дизайнер", "Інвестор"], c: 1}, EN: {q: "Who is David Johnston?", a: ["Moderator", "Project Lead", "Designer", "Investor"], c: 1} },
        { UA: {q: "На якій мережі базується GenPod?", a: ["Ethereum Mainnet", "GenLayer Testnet", "Solana", "Bitcoin"], c: 1}, EN: {q: "Which network is GenPod on?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Bitcoin"], c: 1} },
        { UA: {q: "Що таке 'Intelligent Contracts'?", a: ["Просто код", "Смарт-контракти з ШІ", "Паперові угоди", "Скрипти"], c: 1}, EN: {q: "What are Intelligent Contracts?", a: ["Basic code", "AI-powered contracts", "Paper contracts", "Scripts"], c: 1} },
        { UA: {q: "Яка перевага децентралізованого ШІ?", a: ["Більше реклами", "Відсутність цензури та контроль", "Вища ціна", "Складність"], c: 1}, EN: {q: "Benefit of decentralized AI?", a: ["More ads", "No censorship & control", "Higher price", "Complexity"], c: 1} },
        { UA: {q: "Що таке 'Hallucination' у ШІ-агентів?", a: ["Швидка робота", "Вигадування фактів", "Гарний дизайн", "Помилка мережі"], c: 1}, EN: {q: "What is AI Hallucination?", a: ["Speed", "Fabricating facts", "Design", "Network error"], c: 1} },
        { UA: {q: "Скільки часу дається на одне питання в цьому квізі?", a: ["5 сек", "10 сек", "15 сек", "30 сек"], c: 2}, EN: {q: "Time per question?", a: ["5s", "10s", "15s", "30s"], c: 2} },
        { UA: {q: "GenLayer використовує концепцію...?", a: ["Proof of Work", "Optimistic Execution", "Proof of Stake", "Delegation"], c: 1}, EN: {q: "GenLayer concept?", a: ["PoW", "Optimistic Execution", "PoS", "Delegation"], c: 1} },
        { UA: {q: "Чим GenPod відрізняється від звичайних подкастів?", a: ["Нічим", "Інтерактивність через ШІ", "Тільки звук", "Платна підписка"], c: 1}, EN: {q: "GenPod vs normal podcasts?", a: ["Nothing", "AI Interactivity", "Audio only", "Subscription"], c: 1} },
        { UA: {q: "Чи готові ви до майбутнього, де ШІ є частиною блокчейну?", a: ["Ні", "Можливо", "Так, це GenLayer!", "Пізніше"], c: 2}, EN: {q: "Ready for AI + Blockchain?", a: ["No", "Maybe", "Yes, GenLayer!", "Later"], c: 2} }
    ];

    async function connect(type) {
        if (!window.ethereum) return alert("Гаманець не знайдено!");
        try {
            // Спроба переключити на GenLayer
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: GEN_CHAIN_ID }],
            }).catch(async (e) => {
                if (e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: GEN_CHAIN_ID,
                            chainName: 'GenLayer Testnet',
                            rpcUrls: ['https://rpc.genlayer.com'], // Перевір актуальний RPC
                            nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 }
                        }]
                    });
                }
            });

            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            
            document.getElementById('selector').style.display = 'none';
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').innerText = "✓ " + type.toUpperCase() + " ПІДКЛЮЧЕНО";
            document.getElementById('start-btn').disabled = false;
        } catch (err) { alert("Помилка підключення. Оберіть GenLayer мережу."); }
    }

    function begin() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQ();
    }

    function loadQ() {
        clearInterval(timer);
        let sec = 15;
        document.getElementById('timer').innerText = sec;
        document.getElementById('progress').innerText = `Питання ${currentQ + 1} / 10`;
        
        const data = quizData[currentQ][currentLang] || quizData[currentQ]['EN'];
        document.getElementById('q-text').innerText = data.q;
        const optBox = document.getElementById('options');
        optBox.innerHTML = '';
        
        data.a.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = txt;
            b.onclick = () => { if(i === data.c) score++; next(); };
            optBox.appendChild(b);
        });

        timer = setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = sec;
            if(sec <= 0) next();
        }, 1000);
    }

    function next() {
        currentQ++;
        if(currentQ < 10) loadQ();
        else {
            clearInterval(timer);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('score-display').innerText = `${score} / 10`;
        }
    }

    async function sendToBlockchain() {
        if(!signer) return;
        try {
            document.getElementById('save-btn').innerText = "НАДСИЛАННЯ...";
            const abi = ["function submitScore(uint256 score) public"];
            const contract = new ethers.Contract(CONTRACT, abi, signer);
            const tx = await contract.submitScore(score);
            alert("Транзакцію надіслано! Хеш: " + tx.hash);
            await tx.wait();
            document.getElementById('save-btn').innerText = "ЗБЕРЕЖЕНО ✓";
        } catch (e) { 
            alert("Помилка! Переконайтеся, що ви в мережі GenLayer."); 
            document.getElementById('save-btn').innerText = "ЗБЕРЕГТИ В GENLAYER";
        }
    }

    function changeLang(l) {
        currentLang = l;
        document.querySelectorAll('.lang-item').forEach(i => i.classList.remove('active'));
        // Спрощена логіка зміни активного класу
    }
</script>
</body>
</html>
