<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - Choose Wallet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; padding: 20px; background: #0a0a0a; border-radius: 20px; border: 1px solid #222; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; }
        
        .wallet-choice { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .wallet-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .wallet-btn:hover { background: #222; border-color: #00f2ff; }
        .wallet-btn img { width: 24px; height: 24px; border-radius: 4px; }
        
        .btn-start { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; width: 100%; font-size: 18px; margin-top: 10px; transition: 0.3s; }
        .btn-start:disabled { background: #333; color: #777; cursor: not-allowed; }
        
        .option-btn { display: block; width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 15px; margin: 8px 0; border-radius: 12px; cursor: pointer; text-align: left; }
        .option-btn:hover { border-color: #00f2ff; background: #222; }
        
        #timer { font-size: 32px; color: #ff0055; font-weight: bold; margin: 10px 0; }
        .lang-bar { margin-top: 20px; display: flex; justify-content: center; gap: 5px; padding-bottom: 30px; }
        .lang-btn { background: #111; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .lang-btn.active { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" class="banner" alt="Banner">

    <div id="start-screen">
        <h1 id="txt-title">GenPod Interview</h1>
        <p id="txt-subtitle">Select your wallet to play</p>
        
        <div class="wallet-choice" id="wallet-selector">
            <button class="wallet-btn" onclick="connectWallet('metamask')">
                🦊 MetaMask
            </button>
            <button class="wallet-btn" onclick="connectWallet('okx')">
                🖤 OKX Wallet
            </button>
            <button class="wallet-btn" onclick="connectWallet('rabby')">
                💙 Rabby Wallet
            </button>
        </div>

        <div id="wallet-status" style="display:none; color: #00f2ff; margin-bottom: 15px; font-weight: bold;">✓ Connected</div>
        
        <button class="btn-start" id="main-start-btn" disabled onclick="startQuiz()">START QUIZ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="q-progress" style="color: #888;">Question 1 / 10</div>
        <div id="timer">15</div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 id="txt-finish">Finished!</h1>
        <div id="final-score" style="font-size: 48px; color: #00f2ff; font-weight: bold; margin: 20px 0;"></div>
        <button class="btn-start" id="save-btn" onclick="submitToBlockchain()">SAVE TO BLOCKCHAIN</button>
    </div>
</div>

<div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('EN')">🇺🇸 EN</button>
    <button class="lang-btn" onclick="setLang('FR')">🇫🇷 FR</button>
    <button class="lang-btn" onclick="setLang('ES')">🇪🇸 ES</button>
    <button class="lang-btn" onclick="setLang('TR')">🇹🇷 TR</button>
    <button class="lang-btn" onclick="setLang('UA')">🇺🇦 UA</button>
</div>

<script>
    const CONTRACT_ADDRESS = "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383";
    let currentLang = 'EN';
    let signer = null;
    let score = 0;
    let currentQ = 0;
    let timerInterval;

    // Питання (скорочено для прикладу, залиш свій масив з 10 питань тут)
    const questions = [
        { EN: { q: "What is GenLayer?", a: ["Social App", "Blockchain for AI", "Game", "Bank"], c: 1 }, UA: { q: "Що таке GenLayer?", a: ["Соцмережа", "Блокчейн для ШІ", "Гра", "Банк"], c: 1 }, FR: { q: "C'est quoi GenLayer?", a: ["App", "Blockchain AI", "Jeu", "Banque"], c: 1 }, ES: { q: "¿Qué es GenLayer?", a: ["App", "Blockchain AI", "Juego", "Banco"], c: 1 }, TR: { q: "GenLayer nedir?", a: ["Uygulama", "Blok Zinciri", "Oyun", "Banka"], c: 1 } },
        // ... додай сюди всі інші 9 питань
    ];

    async function connectWallet(type) {
        if (!window.ethereum) return alert("No wallet found!");

        try {
            let provider;
            // Спроба знайти конкретний провайдер (MetaMask, OKX або Rabby часто конфліктують)
            if (type === 'okx' && window.okxwallet) {
                provider = new ethers.BrowserProvider(window.okxwallet);
            } else if (type === 'rabby' && window.rabby) {
                provider = new ethers.BrowserProvider(window.rabby);
            } else {
                provider = new ethers.BrowserProvider(window.ethereum);
            }

            const accounts = await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();

            // Ховаємо вибір, показуємо статус
            document.getElementById('wallet-selector').style.display = 'none';
            document.getElementById('wallet-status').style.display = 'block';
            document.getElementById('wallet-status').innerText = "✓ Connected: " + type.toUpperCase();
            document.getElementById('main-start-btn').disabled = false;

        } catch (err) {
            console.error(err);
            alert("Connection failed! Please try again.");
        }
    }

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        // (Логіка перекладу тексту як раніше)
    }

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        if(currentQ >= 10) return finishQuiz();
        clearInterval(timerInterval);
        let timeLeft = 15;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('q-progress').innerText = `Question ${currentQ + 1} / 10`;
        
        const qData = questions[0][currentLang]; // Заміни 0 на currentQ
        document.getElementById('question-text').innerText = qData.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        qData.a.forEach((opt, idx) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => { if(idx === qData.c) score++; nextQ(); };
            container.appendChild(b);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) nextQ();
        }, 1000);
    }

    function nextQ() {
        currentQ++;
        if(currentQ < 10) showQuestion();
        else finishQuiz();
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 10`;
    }

    async function submitToBlockchain() {
        if(!signer) return alert("Reconnect wallet!");
        try {
            const abi = ["function submitScore(uint256 score) public"];
            const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
            const tx = await contract.submitScore(score);
            alert("Sent! Hash: " + tx.hash);
            await tx.wait();
            alert("Success!");
        } catch (e) { alert("Error! Check network."); }
    }

    setLang('EN');
</script>
</body>
</html>
