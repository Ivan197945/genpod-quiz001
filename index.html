<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - GenLayer Testnet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; padding: 20px; background: #0a0a0a; border-radius: 20px; border: 1px solid #1f1f1f; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .wallet-box { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .w-btn { display: flex; align-items: center; justify-content: center; gap: 12px; background: #161616; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .w-btn:hover { border-color: #00f2ff; background: #1c1c1c; }
        .btn-action { background: #00f2ff; border: none; color: #000; padding: 16px; font-weight: bold; cursor: pointer; border-radius: 30px; width: 100%; font-size: 18px; margin-top: 10px; text-transform: uppercase; }
        .btn-action:disabled { background: #222; color: #555; cursor: not-allowed; }
        .option-btn { display: block; width: 100%; background: #111; color: #fff; border: 1px solid #222; padding: 15px; margin: 8px 0; border-radius: 12px; cursor: pointer; text-align: left; font-size: 15px; }
        .option-btn:hover { border-color: #00f2ff; background: #161616; }
        #timer { font-size: 32px; color: #ff0055; font-weight: bold; margin: 10px 0; }
        .lang-bar { margin-top: 20px; display: flex; justify-content: center; gap: 8px; padding-bottom: 30px; flex-wrap: wrap; }
        .lang-item { background: #111; border: 1px solid #333; color: #777; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .lang-item.active { border-color: #00f2ff; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" class="banner" alt="GenPod Banner">

    <div id="start-screen">
        <h1 id="txt-title">GenPod Interview</h1>
        <p id="txt-subtitle">Select your wallet (GenLayer Testnet)</p>
        <div class="wallet-box" id="selector">
            <button class="w-btn" onclick="connect('metamask')">🦊 MetaMask</button>
            <button class="w-btn" onclick="connect('okx')">🖤 OKX Wallet</button>
            <button class="w-btn" onclick="connect('rabby')">💙 Rabby Wallet</button>
        </div>
        <p id="status" style="color: #00f2ff; display:none; font-weight: bold; margin-bottom: 15px;"></p>
        <button class="btn-action" id="start-btn" disabled onclick="begin()">START QUIZ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress" style="color: #666; font-size: 14px;">Question 1 / 10</div>
        <div id="timer">15</div>
        <h2 id="q-text" style="font-size: 20px; min-height: 60px; margin: 15px 0;"></h2>
        <div id="options"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 id="txt-finish">Completed!</h1>
        <div id="score-display" style="font-size: 60px; color: #00f2ff; font-weight: bold; margin: 20px 0;"></div>
        <button class="btn-action" id="save-btn" onclick="sendToBlockchain()">SAVE TO GENLAYER</button>
    </div>
</div>

<div class="lang-bar">
    <div class="lang-item active" id="l-UA" onclick="changeLang('UA')">UA</div>
    <div class="lang-item" id="l-EN" onclick="changeLang('EN')">EN</div>
    <div class="lang-item" id="l-TR" onclick="changeLang('TR')">TR</div>
    <div class="lang-item" id="l-ES" onclick="changeLang('ES')">ES</div>
    <div class="lang-item" id="l-FR" onclick="changeLang('FR')">FR</div>
</div>

<script>
    const CONTRACT = "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383";
    const GEN_CHAIN_ID = "0x107d"; // 4221 в HEX
    
    let currentLang = 'UA';
    let signer = null;
    let score = 0;
    let currentQ = 0;
    let timerInterval;

    const translations = {
        UA: { title: "GenPod Інтерв'ю", subtitle: "Оберіть гаманець", start: "ПОЧАТИ КВІЗ", finish: "Завершено!", save: "ЗБЕРЕГТИ В GENLAYER", qPrefix: "Питання" },
        EN: { title: "GenPod Interview", subtitle: "Select your wallet", start: "START QUIZ", finish: "Completed!", save: "SAVE TO GENLAYER", qPrefix: "Question" },
        TR: { title: "GenPod Mülakat", subtitle: "Cüzdan seçin", start: "BAŞLAT", finish: "Tamamlandı!", save: "GENLAYER'A KAYDET", qPrefix: "Soru" },
        ES: { title: "Entrevista GenPod", subtitle: "Seleccionar billetera", start: "EMPEZAR", finish: "¡Completado!", save: "GUARDAR EN GENLAYER", qPrefix: "Pregunta" },
        FR: { title: "Entretien GenPod", subtitle: "Choisir un portefeuille", start: "COMMENCER", finish: "Terminé!", save: "SAUVEGARDER", qPrefix: "Question" }
    };

    const quizData = [
        { UA: {q: "Хто очолює проект GenPod?", a: ["Віталік Бутерін", "Девід Джонстон", "Ілон Маск", "Сатоші"], c: 1}, EN: {q: "Who leads the GenPod project?", a: ["Vitalik Buterin", "David Johnston", "Elon Musk", "Satoshi"], c: 1}, TR: {q: "GenPod projesini kim yönetiyor?", a: ["Vitalik Buterin", "David Johnston", "Elon Musk", "Satoshi"], c: 1}, ES: {q: "¿Quién lidera el proyecto GenPod?", a: ["Vitalik Buterin", "David Johnston", "Elon Musk", "Satoshi"], c: 1}, FR: {q: "Qui dirige le projet GenPod ?", a: ["Vitalik Buterin", "David Johnston", "Elon Musk", "Satoshi"], c: 1} },
        { UA: {q: "Яка мережа використовується для запису результатів?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Polygon"], c: 1}, EN: {q: "Which network records the results?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Polygon"], c: 1}, TR: {q: "Sonuçlar hangi ağa kaydediliyor?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Polygon"], c: 1}, ES: {q: "¿Qué red registra los resultados?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Polygon"], c: 1}, FR: {q: "Quel réseau enregistre les résultats ?", a: ["Ethereum", "GenLayer Testnet", "Solana", "Polygon"], c: 1} },
        // Додай ще 8 подібних питань для повного списку з 10...
    ];

    async function connect(type) {
        if (!window.ethereum) return alert("Wallet not found!");
        try {
            // Перемикання на GenLayer Testnet (Chain ID 4221)
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: GEN_CHAIN_ID }],
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: GEN_CHAIN_ID,
                            chainName: 'GenLayer Testnets',
                            rpcUrls: ['https://zksync-os-testnet-genlayer.zksync.dev'],
                            nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
                            blockExplorerUrls: ['https://zksync-os-testnet-genlayer.explorer.zksync.io']
                        }]
                    });
                }
            }

            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            
            document.getElementById('selector').style.display = 'none';
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.innerText = "✓ " + type.toUpperCase() + " CONNECTED";
            document.getElementById('start-btn').disabled = false;
        } catch (err) { alert("Connection failed. Please select GenLayer network."); }
    }

    function changeLang(l) {
        currentLang = l;
        document.querySelectorAll('.lang-item').forEach(i => i.classList.remove('active'));
        document.getElementById('l-' + l).classList.add('active');
        const t = translations[l];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-subtitle').innerText = t.subtitle;
        document.getElementById('start-btn').innerText = t.start;
        document.getElementById('txt-finish').innerText = t.finish;
        document.getElementById('save-btn').innerText = t.save;
    }

    function begin() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQ();
    }

    function loadQ() {
        clearInterval(timerInterval);
        let sec = 15;
        document.getElementById('timer').innerText = sec;
        document.getElementById('progress').innerText = `${translations[currentLang].qPrefix} ${currentQ + 1} / 10`;
        
        const data = quizData[currentQ] ? quizData[currentQ][currentLang] : quizData[0][currentLang];
        document.getElementById('q-text').innerText = data.q;
        const optBox = document.getElementById('options');
        optBox.innerHTML = '';
        
        data.a.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = txt;
            b.onclick = () => { if(i === data.c) score++; next(); };
            optBox.appendChild(b);
        });

        timerInterval = setInterval(() => {
            sec--;
            document.getElementById('timer').innerText = sec;
            if(sec <= 0) next();
        }, 1000);
    }

    function next() {
        currentQ++;
        if(currentQ < 10) loadQ();
        else {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('score-display').innerText = `${score} / 10`;
        }
    }

    async function sendToBlockchain() {
        if(!signer) return;
        try {
            document.getElementById('save-btn').innerText = "SENDING...";
            const abi = ["function submitScore(uint256 score) public"];
            const contract = new ethers.Contract(CONTRACT, abi, signer);
            const tx = await contract.submitScore(score);
            alert("Sent! Hash: " + tx.hash);
            await tx.wait();
            document.getElementById('save-btn').innerText = "SAVED ✓";
        } catch (e) { 
            alert("Error! Check if you are on GenLayer network."); 
            document.getElementById('save-btn').innerText = translations[currentLang].save;
        }
    }

    changeLang('UA');
</script>
</body>
</html>
