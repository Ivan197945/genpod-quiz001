<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz - David Johnston Interview</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; width: 90%; font-size: 16px; display: inline-block; }
        .btn:disabled { background: #444; cursor: not-allowed; color: #888; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; font-size: 16px; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        .timer-container { width: 100%; background: #222; height: 8px; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        #timer-bar { background: #00f2ff; height: 100%; width: 100%; transition: width 1s linear; }
        .status-ok { color: #00ff88; font-size: 14px; display: none; margin-top: 10px; font-weight: bold; }
        #progress { color: #00f2ff; margin-bottom: 10px; font-weight: bold; font-size: 18px; }
        .lang-bar { padding: 15px; background: #111; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid #222; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Header" class="banner">
    
    <div id="start-screen">
        <h1 id="txt-title">David Johnston Quiz</h1>
        <p id="txt-desc">Вікторина за матеріалами інтерв'ю</p>
        
        <div style="background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; margin-bottom: 20px;">
            <button class="btn" id="wallet-btn" onclick="connectWallet()">Підключити гаманець</button>
            <p id="wallet-status" class="status-ok">✔ Гаманець підключено</p>
        </div>

        <button class="btn" id="start-quiz-btn" disabled onclick="startQuiz()" style="background: #ff0055; color: #fff; font-size: 20px;">ПОЧАТИ КВІЗ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="progress">Питання 1 / 10</div>
        <div class="timer-container"><div id="timer-bar"></div></div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 id="txt-finish">Готово!</h1>
        <p id="final-score" style="font-size: 48px; color: #00f2ff; font-weight: bold;"></p>
        <p id="tx-info" style="color: #00ff88;">Надсилання транзакції в GenLayer Testnet...</p>
    </div>
</div>

<div class="lang-bar">
    <button class="lang-btn active" id="l-ua" onclick="setLang('UA')">🇺🇦 UA</button>
    <button class="lang-btn" id="l-en" onclick="setLang('EN')">🇺🇸 EN</button>
    <button class="lang-btn" id="l-tr" onclick="setLang('TR')">🇹🇷 TR</button>
    <button class="lang-btn" id="l-es" onclick="setLang('ES')">🇪🇸 ES</button>
    <button class="lang-btn" id="l-fr" onclick="setLang('FR')">🇫🇷 FR</button>
</div>

<script>
    let currentLang = 'UA';
    let userAddress = "";
    let currentQ = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    const translations = {
        UA: { title: "David Johnston Quiz", desc: "Вікторина за матеріалами інтерв'ю", wallet: "Підключити гаманець", start: "ПОЧАТИ КВІЗ", finish: "Вікторину завершено!", tx: "Надсилання в GenLayer..." },
        EN: { title: "David Johnston Quiz", desc: "Quiz based on the interview", wallet: "Connect Wallet", start: "START QUIZ", finish: "Quiz Finished!", tx: "Sending to GenLayer..." },
        TR: { title: "David Johnston Quiz", desc: "Röportaj temalı yarışma", wallet: "Cüzdanı Bağla", start: "BAŞLAT", finish: "Yarışma Bitti!", tx: "GenLayer'a gönderiliyor..." },
        ES: { title: "Quiz de David Johnston", desc: "Cuestionario de la entrevista", wallet: "Conectar Billetera", start: "EMPEZAR", finish: "¡Quiz Terminado!", tx: "Enviando a GenLayer..." },
        FR: { title: "Quiz David Johnston", desc: "Quiz basé sur l'interview", wallet: "Connecter Portefeuille", start: "COMMENCER", finish: "Quiz Terminé!", tx: "Envoi vers GenLayer..." }
    };

    const questions = [
        {
            UA: "З якою системою Девід порівнює централізований ШІ?",
            EN: "What system does David compare centralized AI to?",
            TR: "Merkezi yapay zekayı hangi sistemle kıyaslıyor?",
            ES: "¿Con qué sistema compara David la IA centralizada?",
            FR: "À quel système David compare-t-il l'IA centralisée?",
            a: ["Soviet Union", "Roman Empire", "Federal Reserve", "Global Network"], c: 0
        },
        {
            UA: "Що є головним критерієм Девіда при виборі технологій?",
            EN: "What is David's main criterion for choosing tech?",
            TR: "David'in teknoloji seçimindeki ana kriteri nedir?",
            ES: "¿Cuál es el criterio principal de David?",
            FR: "Quel est le critère principal de David?",
            a: ["Profit", "Human Freedom", "Complexity", "Popularity"], c: 1
        },
        {
            UA: "Що Девід називає новим 'вузьким місцем' (bottleneck) ШІ?",
            EN: "What does David call the new AI 'bottleneck'?",
            TR: "Yapay zekadaki yeni 'darboğaz' nedir?",
            ES: "¿Cuál es el nuevo 'cuello de botella'?",
            FR: "Quel est le nouveau 'goulot d'étranglement'?",
            a: ["GPU Power", "Internet Speed", "Agency describing", "Storage"], c: 2
        },
        {
            UA: "Скільки агентів Девід хоче запустити до кінця року?",
            EN: "How many agents does David want by year end?",
            TR: "David yıl sonuna kadar kaç ajan istiyor?",
            ES: "¿Cuántos agentes quiere David para fin de año?",
            FR: "Combien d'agents David veut-il d'ici la fin de l'année?",
            a: ["10", "50", "100", "1000"], c: 2
        },
        {
            UA: "За 'Законом Джонстона', що буде децентралізовано?",
            EN: "By 'Johnston's Law', what will be decentralized?",
            TR: "Johnston Yasası'na göre ne merkeziyetsizleşecek?",
            ES: "Según la Ley de Johnston, ¿qué se descentralizará?",
            FR: "Selon la loi de Johnston, qu'est-ce qui sera décentralisé?",
            a: ["Everything that can be", "Only Money", "Only Apps", "Nothing"], c: 0
        },
        {
            UA: "Яке співвідношення ШІ-інтелекту до людського він прогнозує?",
            EN: "What AI-to-human brain power ratio does he predict?",
            TR: "İnsan beynine kıyasla ne kadar yapay zeka gücü öngörüyor?",
            ES: "¿Qué proporción de potencia cerebral de IA predice?",
            FR: "Quel rapport de puissance cérébrale IA/humain prévoit-il?",
            a: ["2x", "5x", "10x", "Equal"], c: 1
        },
        {
            UA: "Який стандарт платежів для агентів він виділяє (Coinbase)?",
            EN: "What payment standard for agents does he mention?",
            TR: "Ajan ödemeleri için hangi standardı belirtiyor?",
            ES: "¿Qué estándar de pago para agentes menciona?",
            FR: "Quel standard de paiement pour agents mentionne-t-il?",
            a: ["ERC-20", "x402", "Lightning", "SWIFT"], c: 1
        },
        {
            UA: "Чому ШІ та крипто — ідеальна пара?",
            EN: "Why are AI and crypto a perfect pair?",
            TR: "Neden yapay zeka ve kripto mükemmel bir ikili?",
            ES: "¿Por qué la IA y el cripto son la pareja perfecta?",
            FR: "Pourquoi l'IA et la crypto sont-elles le duo parfait?",
            a: ["Hype", "Programmable money needs", "Mining", "Cheaper"], c: 1
        },
        {
            UA: "Як називається інфраструктура Morpheus VM для агентів?",
            EN: "What is the infrastructure VM for agents called?",
            TR: "Ajanlar için altyapı VM'sinin adı nedir?",
            ES: "¿Cómo se llama la VM de infraestructura?",
            FR: "Comment s'appelle la VM d'infrastructure?",
            a: ["Ethereum VM", "Morpheus VM", "Bitcoin VM", "Claude VM"], c: 1
        },
        {
            UA: "Що блокчейн виправляє у світі грошей?",
            EN: "What does blockchain fix in the world of money?",
            TR: "Blokzincir para dünyasında neyi düzeltiyor?",
            ES: "¿Qué soluciona el blockchain en el dinero?",
            FR: "Que corrige la blockchain dans le monde de l'argent?",
            a: ["Internet Access", "Monetary freedom", "Education", "Travel"], c: 1
        }
    ];

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('l-' + lang.toLowerCase()).classList.add('active');
        
        const t = translations[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-desc').innerText = t.desc;
        if(!userAddress) document.getElementById('wallet-btn').innerText = t.wallet;
        document.getElementById('start-quiz-btn').innerText = t.start;
        document.getElementById('txt-finish').innerText = t.finish;
        
        if(document.getElementById('quiz-screen').style.display === 'block') {
            updateQuestionUI();
        }
    }

    async function connectWallet() {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                document.getElementById('wallet-status').style.display = 'block';
                document.getElementById('wallet-btn').innerText = "OK: " + userAddress.substring(0,6);
                document.getElementById('start-quiz-btn').disabled = false;
            } catch (e) { alert("Error"); }
        } else { alert("Install MetaMask!"); }
    }

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timer);
        timeLeft = 15;
        updateTimerBar();
        updateQuestionUI();
        
        timer = setInterval(() => {
            timeLeft--;
            updateTimerBar();
            if (timeLeft <= 0) handleAnswer(-1);
        }, 1000);
    }

    function updateQuestionUI() {
        const q = questions[currentQ];
        document.getElementById('progress').innerText = (currentLang === 'UA' ? 'Питання ' : 'Question ') + (currentQ + 1) + " / 10";
        document.getElementById('question-text').innerText = q[currentLang];
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => handleAnswer(i);
            container.appendChild(b);
        });
    }

    function updateTimerBar() {
        document.getElementById('timer-bar').style.width = (timeLeft / 15 * 100) + "%";
    }

    function handleAnswer(idx) {
        clearInterval(timer);
        if (idx === questions[currentQ].c) score++;
        currentQ++;
        if (currentQ < 10) showQuestion();
        else finish();
    }

    async function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score + " / 10";
        
        if (userAddress) {
            try {
                const txParams = {
                    to: "0x6911e189a3558Bf5c0721AA234C80AaF17cFa383",
                    from: userAddress,
                    value: '0x0',
                    data: '0x' + btoa("Score:" + score).split('').map(c=>c.charCodeAt(0).toString(16)).join('')
                };
                await window.ethereum.request({ method: 'eth_sendTransaction', params: [txParams] });
            } catch (e) {}
        }
    }

    setLang('UA');
</script>
</body>
</html>
