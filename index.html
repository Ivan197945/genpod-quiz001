<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenPod Quiz</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 600px; margin: auto; padding: 20px; flex: 1; }
        img.banner { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .btn { background: #00f2ff; border: none; color: #000; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 30px; margin: 10px; transition: 0.3s; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-x { background: #fff; color: #000; }
        .option-btn { display: block; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; }
        .option-btn:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.1); }
        #timer { font-size: 32px; color: #ff0055; font-weight: bold; margin-bottom: 10px; }
        .lang-bar { padding: 20px; background: #111; border-top: 1px solid #222; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-btn.active { border-color: #00f2ff; color: #fff; background: rgba(0, 242, 255, 0.1); }
        .verification-step { background: #111; padding: 15px; border-radius: 10px; margin: 10px 0; border: 1px solid #222; }
        .status-ok { color: #00ff88; font-size: 12px; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <img src="image.png.jpeg" alt="GenPod Header" class="banner">
    
    <div id="start-screen">
        <h1 id="txt-title">Welcome to GenPod Quiz</h1>
        <p id="txt-subtitle">Complete steps to unlock:</p>
        
        <div class="verification-step">
            <button class="btn" id="wallet-btn" onclick="connectWallet()">1. Connect Wallet</button>
            <p id="wallet-status" class="status-ok">✔ Wallet Connected</p>
        </div>

        <div class="verification-step">
            <button class="btn btn-x" onclick="markTwitter()">2. Follow on X</button>
            <p id="twitter-status" class="status-ok">✔ Followed</p>
        </div>

        <button class="btn" id="main-start-btn" disabled onclick="startQuiz()" style="width: 100%; font-size: 20px;">START QUIZ</button>
    </div>

    <div id="quiz-screen" style="display:none;">
        <div id="timer">15</div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <img src="image.png.jpeg" style="width: 80px; border-radius: 50%;">
        <h1 id="txt-finish">Quiz Finished!</h1>
        <p id="final-score" style="font-size: 50px; color: #00f2ff; font-weight: bold;"></p>
        <button class="btn btn-x" onclick="shareOnX()">Share on X</button>
    </div>
</div>

<!-- Мовна панель: 5 прапорів -->
<div class="lang-bar">
    <button class="lang-btn active" id="btn-en" onclick="setLang('EN')">🇺🇸 EN</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('FR')">🇫🇷 FR</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('ES')">🇪🇸 ES</button>
    <button class="lang-btn" id="btn-tr" onclick="setLang('TR')">🇹🇷 TR</button>
    <button class="lang-btn" id="btn-ua" onclick="setLang('UA')">🇺🇦 UA</button>
</div>

<script>
    let currentLang = 'EN';
    let walletConnected = false;
    let twitterFollowed = false;

    const translations = {
        EN: { title: "Welcome to GenPod Quiz", subtitle: "Complete steps to unlock:", wallet: "1. Connect Wallet", follow: "2. Follow on X", start: "START QUIZ", finish: "Quiz Finished!" },
        FR: { title: "Bienvenue sur GenPod Quiz", subtitle: "Étapes pour déverrouiller:", wallet: "1. Connecter le portefeuille", follow: "2. Suivre sur X", start: "COMMENCER", finish: "Quiz terminé!" },
        ES: { title: "Bienvenido a GenPod Quiz", subtitle: "Pasos para desbloquear:", wallet: "1. Conectar billetera", follow: "2. Seguir en X", start: "EMPEZAR", finish: "¡Quiz terminado!" },
        TR: { title: "GenPod Quiz'e Hoş Geldiniz", subtitle: "Kilidi açmak için adımları tamamlayın:", wallet: "1. Cüzdanı Bağla", follow: "2. X'te Takip Et", start: "QUIZ'E BAŞLA", finish: "Quiz Bitti!" },
        UA: { title: "Вітаємо у GenPod Quiz", subtitle: "Виконайте кроки для входу:", wallet: "1. Підключити гаманець", follow: "2. Підписатись в X", start: "ПОЧАТИ КВІЗ", finish: "Квіз завершено!" }
    };

    const questions = [
        {
            EN: { q: "What is David Johnston’s primary goal?", a: ["Profit", "Human Freedom", "Regulation", "Closed systems"], c: 1 },
            FR: { q: "Quel est l'objectif de David?", a: ["Profit", "Liberté humaine", "Régulation", "Systèmes fermés"], c: 1 },
            ES: { q: "¿Cuál es el objetivo de David?", a: ["Beneficio", "Libertad humana", "Regulación", "Sistemas cerrados"], c: 1 },
            TR: { q: "David Johnston'ın temel amacı nedir?", a: ["Kâr", "İnsan Özgürlüğü", "Düzenleme", "Kapalı sistemler"], c: 1 },
            UA: { q: "Яка головна мета Девіда Джонстона?", a: ["Прибуток", "Свобода людини", "Регуляції", "Закриті системи"], c: 1 }
        },
        {
            EN: { q: "Centralized AI is compared to which economy?", a: ["Soviet Union", "USA", "Singapore", "EU"], c: 0 },
            FR: { q: "L'IA centralisée est comparée à quelle économie?", a: ["Union Soviétique", "USA", "Singapour", "UE"], c: 0 },
            ES: { q: "¿La IA centralizada se compara con qué economía?", a: ["Unión Soviética", "USA", "Singapur", "UE"], c: 0 },
            TR: { q: "Merkezi yapay zeka hangi ekonomiye benzetiliyor?", a: ["Sovyetler Birliği", "ABD", "Singapur", "AB"], c: 0 },
            UA: { q: "На що схожий централізований ШІ?", a: ["СРСР", "США", "Сінгапур", "ЄС"], c: 0 }
        },
        {
            EN: { q: "What is the new 'bottleneck' in the AI age?", a: ["Internet speed", "Coding skills", "Describing the intent", "Hardware"], c: 2 },
            FR: { q: "Quel est le nouveau goulot d'étranglement?", a: ["Vitesse Web", "Codage", "Description de l'intention", "Matériel"], c: 2 },
            ES: { q: "¿Cuál es el nuevo cuello de botella?", a: ["Velocidad Web", "Codificación", "Descripción de la intención", "Hardware"], c: 2 },
            TR: { q: "Yapay zeka çağındaki yeni 'darboğaz' nedir?", a: ["İnternet hızı", "Kodlama becerileri", "Amacı tanımlamak", "Donanım"], c: 2 },
            UA: { q: "Що є новим 'вузьким місцем' в епоху ШІ?", a: ["Швидкість інтернету", "Навички кодування", "Опис завдання агенту", "Залізо"], c: 2 }
        }
    ];

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang.toLowerCase()).classList.add('active');
        
        const t = translations[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-subtitle').innerText = t.subtitle;
        if(!walletConnected) document.getElementById('wallet-btn').innerText = t.wallet;
        document.getElementById('main-start-btn').innerText = t.start;
        document.getElementById('txt-finish').innerText = t.finish;
    }

    async function connectWallet() {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                walletConnected = true;
                document.getElementById('wallet-status').style.display = 'block';
                document.getElementById('wallet-btn').innerText = accounts[0].substring(0,6)+'...';
                checkUnlock();
            } catch (e) { alert("Error"); }
        } else { alert("Install MetaMask!"); }
    }

    function markTwitter() {
        twitterFollowed = true;
        document.getElementById('twitter-status').style.display = 'block';
        window.open('https://x.com/GenLayer', '_blank');
        checkUnlock();
    }

    function checkUnlock() {
        if(walletConnected && twitterFollowed) document.getElementById('main-start-btn').disabled = false;
    }

    let currentQ = 0; let score = 0; let timer; let timeLeft = 15;

    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        clearInterval(timer);
        timeLeft = 15;
        document.getElementById('timer').innerText = timeLeft;
        const qData = questions[currentQ][currentLang];
        document.getElementById('question-text').innerText = qData.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        qData.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => { if(i === qData.c) score++; nextQ(); };
            container.appendChild(b);
        });
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) nextQ();
        }, 1000);
    }

    function nextQ() {
        currentQ++;
        if(currentQ < questions.length) showQuestion();
        else {
            clearInterval(timer);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        }
    }

    function shareOnX() {
        const text = `I scored ${score}/${questions.length} on @GenLayer Quiz! 🚀`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
    }

    setLang('EN');
</script>
</body>
</html>
